name: Site quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check production dependencies
        run: npm audit --omit=dev
      - name: Test server behavior
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Check flows, search content and accessibility
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/ven-dev.log 2>&1 &
          npm run preview -- --host 127.0.0.1 --port 4176 --strictPort > /tmp/ven-preview.log 2>&1 &
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null && curl -fsS http://127.0.0.1:4176/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ > /dev/null
          curl -fsS http://127.0.0.1:4176/ > /dev/null
          npm run test:browser
          npm run test:quality
