<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/webp" href="/assets/footer-mark.webp" />
    <link
      rel="preload"
      href="/node_modules/@fontsource/jost/files/jost-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-800-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!--seo-head-->
  </head>
  <body>
    <a class="skip-link" href="#main">Saltar al contenido</a>
    <header class="site-header shell">
      <a href="/" aria-label="VOOM · Inicio"
        ><img
          class="logo"
          src="/assets/voom-logo.webp"
          alt="VOOM"
          width="158"
          height="54"
      /></a>
      <span class="eyebrow" id="header-label">VEN</span>
    </header>
    <main id="main" tabindex="-1">
      <div id="experience" tabindex="-1">
        <!--entry-start--><!--app-entry--><!--entry-end-->
      </div>
      <!--site-info-->
    </main>
    <footer class="site-footer">
      <div class="shell footer-inner">
        <p class="deadline eyebrow" hidden></p>
        <img
          loading="lazy"
          decoding="async"
          class="waves"
          src="/assets/waves.webp"
          alt=""
          width="573"
          height="54"
        />
        <div class="footer-copy">
          <p>
            Seguir es para seguidores.<br class="mobile-break" />
            Evolucionar es para VOOMERS.
          </p>
          <p class="legal">
            Solo mayores de 18 ·
            <a class="privacy-link" href="/privacidad/"
              >Política de privacidad</a
            >
          </p>
        </div>
        <img
          loading="lazy"
          decoding="async"
          class="footer-mark"
          src="/assets/footer-mark.webp"
          width="54"
          height="60"
          alt=""
        />
      </div>
      <!--footer-details-->
    </footer>
    <noscript
      ><p class="no-script shell">
        Puedes leer toda la información de VOOM en esta página. Para enviar el
        formulario de VEN necesitas activar JavaScript.
      </p></noscript
    >
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
